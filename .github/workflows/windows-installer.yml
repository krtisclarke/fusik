# Build the Windows installer on a real Windows machine.
#
# The app is developed on a Mac; this is how it reaches the machine it was
# always for. Runs on demand (the Actions tab's "Run workflow" button), and on
# any tag starting with v — a tagged run also publishes the installer as a
# GitHub Release, which gives a stable download link.
#
# The installer is unsigned: there is no code-signing certificate, so Windows
# SmartScreen shows its "protected your PC" notice on first run — More info,
# then "Run anyway", once. Signing would need a paid identity-verified
# certificate and is a decision for later, not a build step.

name: Windows installer

on:
  workflow_dispatch:
  push:
    tags: ['v*']

# The default workflow token is read-only; creating a Release is a write.
permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Tests
        run: npm test

      - name: Build installer
        run: npm run package:win

      # The .blockmap and latest.yml ride along with the installer on purpose:
      # installed apps read latest.yml from the newest Release to learn a new
      # version exists, and the blockmap lets them download only what changed.
      # A Release without them is an installer people can download but
      # installed apps cannot see.
      - name: Keep the installer as a downloadable artifact
        uses: actions/upload-artifact@v4
        with:
          name: Beatbox-Studio-Windows-Setup
          path: |
            release/*.exe
            release/*.blockmap
            release/latest.yml
          if-no-files-found: error

      - name: Publish a Release on tags
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $files = @(Get-Item release/*.exe) + @(Get-Item release/*.blockmap) + @(Get-Item release/latest.yml)
          gh release create $env:GITHUB_REF_NAME @($files.FullName) --title "Beatbox Studio $env:GITHUB_REF_NAME" --notes "Windows installer. Unsigned, so SmartScreen asks once - More info, then Run anyway. Installed copies update themselves from this page."
        env:
          GH_TOKEN: ${{ github.token }}
